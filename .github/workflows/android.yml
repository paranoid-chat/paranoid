name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["relay/**", "site/**", "images/**", ".github/workflows/images.yml", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore de signature
        env:
          KEYSTORE_B64: ${{ secrets.PARANOID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paranoid.jks"
            echo "PARANOID_KEYSTORE=$RUNNER_TEMP/paranoid.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucun keystore dans les secrets : APK signé avec une clé de debug jetable. Chaque build aura une signature différente et l'appli devra être désinstallée (identité perdue) pour être mise à jour."
          fi

      - name: Tests du core et compilation
        env:
          PARANOID_KEYSTORE_PASSWORD: ${{ secrets.PARANOID_KEYSTORE_PASSWORD }}
          PARANOID_KEY_ALIAS: ${{ secrets.PARANOID_KEY_ALIAS }}
          PARANOID_KEY_PASSWORD: ${{ secrets.PARANOID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :core:test :app:assembleRelease

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-core
          path: core/build/reports/tests/
          if-no-files-found: ignore

      - name: Vérifier la signature
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | grep -iE "verified using v2|certificate (DN|SHA-256)"

      - name: Nom de l'APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "paranoid-$v-${GITHUB_SHA::7}.apk"
          sha256sum paranoid-*.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: paranoid-apk
          path: |
            paranoid-*.apk
            SHA256SUMS
          retention-days: 14

      - name: Release GitHub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ -z "$PARANOID_KEYSTORE" ]; then
            echo "::warning::APK signé avec une clé de debug : pas de release."
            exit 0
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v déjà publiée : augmenter versionName pour en publier une nouvelle."
            exit 0
          fi
          mkdir rel
          cp paranoid-*.apk rel/paranoid.apk
          (cd rel && sha256sum paranoid.apk > SHA256SUMS)
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$signer" verify --print-certs rel/paranoid.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo "Paranoid $v (commit ${GITHUB_SHA::7})."
            echo
            echo "SHA-256 de paranoid.apk : \`$(cut -d' ' -f1 rel/SHA256SUMS)\`"
            echo
            echo "SHA-256 du certificat de signature : \`$cert\` (à comparer avec *Mes infos en direct*)."
          } > rel/notes.md
          gh release create "v$v" rel/paranoid.apk rel/SHA256SUMS --target "$GITHUB_SHA" \
            --title "Paranoid $v" --notes-file rel/notes.md --latest
