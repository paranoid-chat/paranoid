name: Relais

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Dépendances
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum 2>/dev/null || ! git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            echo "::warning::go.mod/go.sum à mettre à jour dans le dépôt (go mod tidy). Contenu attendu :"
            echo "----- go.mod -----"; cat go.mod; echo "----- go.sum -----"; cat go.sum; echo "----- fin -----"
          fi

      - name: Tests (relais avec SQLite + client)
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Vérification des scripts du paquet
        run: |
          shellcheck -s bash -S warning packaging/root/usr/sbin/paranoid-relay
          shellcheck -s sh -S warning packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm

      - name: Binaires Linux statiques et paquets .deb
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version=$(cat packaging/VERSION)
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/relayd-linux-$arch .
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/relaycli-linux-$arch ./cmd/relaycli
          done
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/relaycli-windows-amd64.exe ./cmd/relaycli
          for arch in amd64 arm64; do
            packaging/build-deb.sh $arch dist/relayd-linux-$arch dist
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: relais-binaires
          path: relay/dist/
          retention-days: 14
