name: Images du relais

on:
  push:
    branches: [main]
    paths: ["relay/**", "images/**", ".github/workflows/images.yml"]
  workflow_dispatch:
    inputs:
      replace:
        description: "Remplacer la release existante de cette version"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Version et release brouillon
        id: v
        run: |
          v=$(cat relay/packaging/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tag=relay-v$v
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            if [ "${{ github.event_name }}" != workflow_dispatch ] || [ "${{ inputs.replace }}" != true ]; then
              echo "Release $tag déjà publiée : augmenter relay/packaging/VERSION pour en publier une nouvelle."
              echo "build=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --yes; fi
          git push -q origin ":refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Relais Paranoid $v" --notes "En cours de construction."
          echo "build=yes" >> "$GITHUB_OUTPUT"

  iso:
    needs: prepare
    if: needs.prepare.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Paquets .deb
        working-directory: relay
        env:
          CGO_ENABLED: "0"
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p ../out
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o /tmp/relayd-$arch .
            packaging/build-deb.sh $arch /tmp/relayd-$arch ../out
          done
      - name: ISO amd64 (Debian 13, installeur hors ligne)
        run: |
          v=${{ needs.prepare.outputs.version }}
          docker run --privileged --rm -v "$PWD:/w" -w /w debian:trixie \
            sh images/iso/build.sh "$v" "/w/out/paranoid-relay_${v}_amd64.deb" /w/out
      - name: Envoi dans la release
        run: |
          cd out
          sudo chown "$(id -u)" ./*
          sha256sum ./*.iso ./*.deb | sed 's#  \./#  #' > SHA256SUMS.iso
          for f in ./*.iso ./*.deb SHA256SUMS.iso; do
            for i in 1 2 3; do gh release upload "relay-v${{ needs.prepare.outputs.version }}" "$f" --clobber && break; sleep 20; done
          done

  pi:
    needs: prepare
    if: needs.prepare.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Paquet .deb arm64
        working-directory: relay
        env:
          CGO_ENABLED: "0"
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p ../out
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$v" -o /tmp/relayd-arm64 .
          packaging/build-deb.sh arm64 /tmp/relayd-arm64 ../out
      - name: Image Raspberry Pi (arm64)
        run: |
          v=${{ needs.prepare.outputs.version }}
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          sudo bash images/pi/build.sh "$v" "out/paranoid-relay_${v}_arm64.deb" out
      - name: Envoi dans la release
        run: |
          cd out
          sudo chown "$(id -u)" ./*
          sha256sum ./*.img.xz | sed 's#  \./#  #' > SHA256SUMS.pi
          for f in ./*.img.xz SHA256SUMS.pi; do
            for i in 1 2 3; do gh release upload "relay-v${{ needs.prepare.outputs.version }}" "$f" --clobber && break; sleep 20; done
          done

  publish:
    needs: [prepare, iso, pi]
    if: needs.prepare.outputs.build == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Somme de contrôle et publication
        run: |
          v=${{ needs.prepare.outputs.version }}
          tag=relay-v$v
          mkdir rel && cd rel
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS.*'
          cat SHA256SUMS.iso SHA256SUMS.pi > SHA256SUMS
          cat SHA256SUMS
          {
            echo "Relais Paranoid $v (commit ${GITHUB_SHA::7})."
            echo
            echo "- \`paranoid-relay-$v-amd64.iso\` : PC ou VM amd64 (BIOS ou UEFI). Installation hors ligne : le menu de démarrage n'a pas de choix par défaut, l'installeur demande le disque puis de taper EFFACER (ERASE) avant d'effacer ; au premier démarrage, un assistant règle tout."
            echo "- \`paranoid-relay-$v-raspberrypi-arm64.img.xz\` : Raspberry Pi 3, 4, 5 (Raspberry Pi OS Lite 64 bits). À écrire sur une carte SD (Raspberry Pi Imager, image personnalisée) ; au premier démarrage, avec écran et clavier, le même assistant."
            echo "- \`paranoid-relay_${v}_amd64.deb\`, \`paranoid-relay_${v}_arm64.deb\` : pour une Debian existante (\`apt install ./…deb\` puis \`paranoid-relay config\`)."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber
          gh release delete-asset "$tag" SHA256SUMS.iso -R "$GITHUB_REPOSITORY" --yes
          gh release delete-asset "$tag" SHA256SUMS.pi -R "$GITHUB_REPOSITORY" --yes
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest=false
